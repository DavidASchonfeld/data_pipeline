# Local laptop stack for agent_data (the `local` platform profile): pgvector — the same image production
# runs on K3s — plus the agent_data API. Start with `docker compose up --build`, then open
# http://127.0.0.1:8080/healthz. Both ports bind to 127.0.0.1 only, so nothing is reachable from the network.
# Values come from the gitignored .env file (see .env.example); PGVECTOR_PASSWORD has no default on purpose.

name: agent-data

services:
  pgvector:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: ${PGVECTOR_USER:-pgvector}
      POSTGRES_PASSWORD: ${PGVECTOR_PASSWORD:?Set PGVECTOR_PASSWORD in .env (see .env.example)}
      POSTGRES_DB: ${PGVECTOR_DB:-pgvector}
    ports:
      - "127.0.0.1:${PGVECTOR_LOCAL_PORT:-5433}:5432"   # 5433 on the laptop avoids clashing with a local Postgres
    volumes:
      - pgvector-data:/var/lib/postgresql/data          # keeps data between restarts; `docker compose down -v` wipes it
      - ./infra/agent_data/local/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      # Ready means Postgres accepts connections for this user and database.
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: .
      dockerfile: infra/agent_data/local/api.Dockerfile
    environment:
      PLATFORM_PROFILE: local
      PGVECTOR_HOST: pgvector                            # the service name above, resolved on the compose network
      PGVECTOR_PORT: "5432"
      PGVECTOR_USER: ${PGVECTOR_USER:-pgvector}
      PGVECTOR_PASSWORD: ${PGVECTOR_PASSWORD:?Set PGVECTOR_PASSWORD in .env (see .env.example)}
      PGVECTOR_DB: ${PGVECTOR_DB:-pgvector}
    ports:
      - "127.0.0.1:${AGENT_DATA_API_PORT:-8080}:8000"
    depends_on:
      pgvector:
        condition: service_healthy                     # don't start the API until the database is ready
    healthcheck:
      # The slim Python image has no curl, so the check uses Python's own HTTP client with a 3s timeout.
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  pgvector-data:
