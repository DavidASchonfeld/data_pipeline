apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: airflow-my-namespace
spec:
  replicas: 1
  strategy:
    type: Recreate        # required for ReadWriteOnce PVC — terminate old pod before starting new
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
    spec:
      # initContainer runs as root to ensure /mlflow-data is writable by the mlflow process
      initContainers:
        - name: fix-permissions
          image: busybox
          command: ["sh", "-c", "chmod -R 777 /mlflow-data && chown -R 1000:1000 /mlflow-data"]  # fix perms + ownership so uvicorn worker (UID 1000) can write DB + artifacts
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow-data
      containers:
        - name: mlflow
          # Pinned, NOT :latest — a floating tag let MLflow drift to a newer 3.x DB schema and then
          # CrashLoopBackOff the pod (2026-06-02). Pin server + client to the SAME exact version (the client
          # is mlflow in airflow/docker/Dockerfile's ml-venv) and bump deliberately, never via :latest.
          # NOTE: ghcr.io mlflow tags carry a `v` prefix (v3.13.0, not 3.13.0). To bump: change this image,
          # MLFLOW_IMAGE in scripts/deploy/mlflow.sh, and the ml-venv mlflow pin all to the same new version.
          image: ghcr.io/mlflow/mlflow:v3.13.0
          imagePullPolicy: Never    # image is pre-imported into K3S containerd by deploy.sh Step 2b5a
          ports:
            - containerPort: 5500
          # sqlite backend keeps MLflow self-contained — no external DB needed.
          #
          # Self-heal schema drift on startup: `mlflow db upgrade` migrates the existing DB forward to the
          # pinned image's schema (alembic, non-destructive — run history is preserved) BEFORE serving. This
          # both recovers the 2026-06-02 incident (the DB sat at 3.x revision 7d34483879f0 while plain
          # `mlflow server` refuses to auto-migrate) and self-heals any future deliberate version bump.
          # GUARD: only upgrade an EXISTING db — `mlflow db upgrade` on a brand-new/empty file errors
          # ("no such table: metrics"); on first boot `mlflow server` initializes the DB itself. (Both
          # behaviours were reproduced and verified locally against mlflow 3.13.0 before this deploy.)
          # `exec` makes mlflow server PID 1 so it still receives K8s stop signals.
          command: ["sh", "-c"]
          args:
            - >-
              DB=/mlflow-data/mlflow.db;
              if [ -f "$DB" ]; then mlflow db upgrade "sqlite:///$DB"; fi;
              exec mlflow server
              --backend-store-uri "sqlite:///$DB"
              --artifacts-destination /mlflow-data/artifacts
              --default-artifact-root mlflow-artifacts:/
              --serve-artifacts
              --host 0.0.0.0
              --port 5500
              --workers 1
              --allowed-hosts '*'
          resources:
            requests:
              cpu: "50m"
              # raised from 256Mi: request=limit ratio was 1:4; kubelet treats burstable pods (request < limit)
              # as lower-priority eviction candidates under node memory pressure. 512Mi narrows the gap
              # and reduces eviction risk without over-reserving on this constrained t3.large node.
              memory: "512Mi"
              # prevents kubelet from evicting this pod first under ephemeral-storage pressure (request=0 = immediate eviction candidate)
              ephemeral-storage: "100Mi"
            limits:
              cpu: "300m"
              # raised from 1Gi: OOMKilled because the mlflow image lazy-loads numpy/pandas/sklearn
              # the first time Airflow logs an experiment. Memory profile: base MLflow+uvicorn ~400MB +
              # lazy ML lib load ~600MB = ~1GB spike. 1536Mi gives ~500MB of safe headroom above observed peak.
              memory: "1536Mi"
              # caps container ephemeral usage (logs, tmp files) — prevents unbounded growth
              ephemeral-storage: "500Mi"
          # startupProbe: blocks liveness/readiness until MLflow finishes its slow first-boot
          # (SQLite init + ML lib loading can take >120s — without this, liveness kills the pod mid-start)
          startupProbe:
            httpGet:
              path: /health
              port: 5500
            periodSeconds: 10
            failureThreshold: 30     # 30 × 10s = 300s max startup window before pod is killed
          # readinessProbe: prevents traffic until MLflow HTTP server is up and accepting requests
          # initialDelaySeconds removed — startupProbe already gates this
          readinessProbe:
            httpGet:
              path: /health      # MLflow built-in health endpoint
              port: 5500
            periodSeconds: 5
            failureThreshold: 6      # ~30s grace before marking pod unready
          # livenessProbe: auto-restarts the pod if MLflow process hangs or crashes post-start
          # initialDelaySeconds removed — startupProbe already gates this
          livenessProbe:
            httpGet:
              path: /health
              port: 5500
            periodSeconds: 10
            failureThreshold: 6      # 60s grace before kill
          volumeMounts:
            - name: mlflow-data
              mountPath: /mlflow-data  # PVC mounted here for DB + artifact persistence
      volumes:
        - name: mlflow-data
          persistentVolumeClaim:
            claimName: mlflow-pvc
